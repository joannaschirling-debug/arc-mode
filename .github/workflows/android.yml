name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 3.0.${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk ArcMode.apk
      - name: Publish as latest release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ArcMode.apk --title "Arc Mode 3.0.${{ github.run_number }}" --notes "Neueste Android-Version. Auf dem Handy ArcMode.apk herunterladen und öffnen." --latest
